# One Dark Pro — modern dark theme (fonts, rounded corners, borders via native theming).
[theme]
base = "dark"
primaryColor = "#61afef"
backgroundColor = "#282c34"
secondaryBackgroundColor = "#21252b"
codeBackgroundColor = "#1e2127"
textColor = "#abb2bf"
linkColor = "#61afef"
borderColor = "#3e4451"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "13px"
codeTextColor = "#abb2bf"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["30px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 500, 500, 500, 500]
linkUnderline = false
blueColor = "#61afef"
greenColor = "#98c379"
yellowColor = "#e5c07b"
redColor = "#e06c75"
violetColor = "#c678dd"
orangeColor = "#d19a66"

[theme.sidebar]
backgroundColor = "#21252b"
secondaryBackgroundColor = "#282c34"
codeBackgroundColor = "#1e2127"
borderColor = "#3e4451"

[browser]
# Container HOME is read-only; disable telemetry to avoid a harmless write traceback.
gatherUsageStats = false
