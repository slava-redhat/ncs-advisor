apiVersion: v1
kind: ServiceAccount
metadata:
  name: ncs
  namespace: ${NAMESPACE}
  annotations:
    # Workload Identity: binds this Kubernetes SA to a Google SA so the ui pod
    # obtains Vertex (Claude-on-Vertex) credentials from the GKE metadata
    # server — no ADC key file mounted in the cluster. GSA_EMAIL defaults to
    # ncs-vertex@<PROJECT_ID>.iam.gserviceaccount.com (override via env
    # GSA_EMAIL). Create the GSA and the KSA<->GSA IAM binding once as a manual
    # step (see infra/gcp/GKE-WORKFLOW.md).
    iam.gke.io/gcp-service-account: ${GSA_EMAIL}
