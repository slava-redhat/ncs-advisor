apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ncs
  namespace: ${NAMESPACE}
  annotations:
    # Streamlit holds long-lived requests; give the proxy generous timeouts.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # The LangGraph runs in-process inside the ui service, so there is
          # no separate orchestrator/API path — everything is the Streamlit ui.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 8501
